plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.hanatour'
version = '0.0.1-SNAPSHOT'

ext['log4j2.version'] = '2.25.5'
ext['logback.version'] = '1.5.38'
ext['tomcat.version'] = '11.0.26'
ext['jackson-bom.version'] = '3.1.7'

repositories {
    mavenCentral()
}

def buildDate = new Date().format("yyyy-MM-dd HH:mm", TimeZone.getTimeZone('Asia/Seoul'))

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs += "--enable-preview"
}

tasks.withType(Test) {
    jvmArgs += "--enable-preview"
}

tasks.named('bootRun') {
    jvmArgs += "--enable-preview"
}

tasks.named('processResources') {
    filesMatching(['static/index.html', 'static/en.html']) {
        expand(buildDate: buildDate)
    }
}

dependencies {

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    constraints {
        implementation('org.apache.commons:commons-lang3:3.20.0') {
            because 'override transitive commons-lang3 from Spring Boot plugin'
        }
    }

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
}

test {
    useJUnitPlatform {
        systemProperties(System.getProperties())
    }
    // .env 파일이 있으면 테스트 JVM에 환경 변수로 전달 (로컬용, .gitignore 권장)
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            line = line.trim()
            if (line && !line.startsWith('#')) {
                int idx = line.indexOf('=')
                if (idx > 0) {
                    String key = line.substring(0, idx).trim()
                    String val = line.substring(idx + 1).trim()
                    if (val.size() >= 2 && ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'")))) {
                        val = val.substring(1, val.length() - 1)
                    }
                    environment key, val
                }
            }
        }
    }
}
