name: Java CI with Gradle

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        version: '25.0'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Test and build Native Image
      run: ./gradlew test nativeCompile

    - name: Stop service
      if: github.event_name != 'pull_request'
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_ADDR }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          PIDS=$(pgrep -f '[j]ava.*any-meal' || true)
          if [ -n "$PIDS" ]; then kill $PIDS; fi
          if [ -f ~/deploy/any-meal.pid ]; then
            PID=$(cat ~/deploy/any-meal.pid)
            if ps -p "$PID" -o args= | grep -Fq '/home/ubuntu/deploy/any-meal'; then
              kill "$PID"
            fi
            rm -f ~/deploy/any-meal.pid
          fi
          pkill -f '[ /]home/ubuntu/deploy/any-meal' || true

    - name: Deploy Native Image
      if: github.event_name != 'pull_request'
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        SOURCE: "./build/native/nativeCompile/any-meal"
        REMOTE_HOST: ${{ secrets.SERVER_ADDR }}
        REMOTE_USER: "ubuntu"
        TARGET: "/home/ubuntu/deploy"

    - name: Deploy native startup script
      if: github.event_name != 'pull_request'
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        SOURCE: "./scripts/start-anymeal-native.sh"
        REMOTE_HOST: ${{ secrets.SERVER_ADDR }}
        REMOTE_USER: "ubuntu"
        TARGET: "/home/ubuntu/deploy"

    - name: Start service
      if: github.event_name != 'pull_request'
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_ADDR }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          chmod +x ~/deploy/any-meal ~/deploy/start-anymeal-native.sh
          ~/deploy/start-anymeal-native.sh
